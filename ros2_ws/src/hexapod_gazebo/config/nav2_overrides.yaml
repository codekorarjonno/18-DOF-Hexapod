# Hexapod changes on top of Nav2's own default nav2_params.yaml.
# nav.launch.py loads the installed defaults and merges this file over them,
# so every Nav2 node still gets all its other settings.
#
# The robot walks straight (w/s) or turns in place (a/d), slowly:
#   while navigating it always uses the wave gait and stands before every
#   change of direction, so it covers roughly 0.6 cm/s
# so the controller turns to face the path first, then walks along it, and
# Nav2 is told to be patient before deciding the robot is stuck.

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    laser_max_range: 12.0          # RPLIDAR C1
    laser_min_range: 0.15
    max_beams: 90
    update_min_d: 0.05             # the robot is slow: update often
    update_min_a: 0.1
    set_initial_pose: true         # starts where the map was started
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    progress_checker:
      # turning in place counts as progress too (the hexapod turns slowly)
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05     # 5 cm walked ...
      required_movement_angle: 0.3       # ... or ~17 deg turned
      movement_time_allowance: 90.0      # within 90 s (stands + slow gait)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30            # "close enough": within 30 cm of the goal = done (fewer last-moment turns)
      yaw_goal_tolerance: 3.14           # ignore the goal's facing: no final turn (fewer commands)
    # turn in place towards the path, then follow it walking straight
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.60       # rad (~35 deg) off the path -> stop and turn
      angular_disengage_threshold: 0.15  # ...and turn until within ~9 deg, so one turn is enough
      forward_sampling_distance: 0.3
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false      # no extra turn at the goal
      desired_linear_vel: 0.06
      lookahead_dist: 0.6                # aim further ahead: smoother, fewer corrections
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 2.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false       # the shim does the turning
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.30                 # feet reach ~0.29 m from the centre: keep (no collisions)
      width: 2
      height: 2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0          # soft band: paths keep away from objects (no corner-hugging)
        inflation_radius: 0.55            # hard limit is still robot_radius 0.30; 0.30-0.55 = 'prefer to avoid'

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      robot_radius: 0.30
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0          # soft band: paths keep away from objects (no corner-hugging)
        inflation_radius: 0.55            # hard limit is still robot_radius 0.30; 0.30-0.55 = 'prefer to avoid'

behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
    max_rotational_vel: 0.3
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.08, 0.0, 0.35]
    min_velocity: [-0.08, 0.0, -0.35]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # Theta*: straight lines between corners (few turns) instead of a grid staircase
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 4.0           # stay in the middle of free space
      use_final_approach_orientation: false
      allow_unknown: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # default_nav_to_pose_bt_xml is set by nav.launch.py (hexapod_bringup/config/nav_lite_bt.xml)
